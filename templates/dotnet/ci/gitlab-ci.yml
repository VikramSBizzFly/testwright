# Opt-in CI for Tier 1/2 .NET projects, the GitLab CI twin of github-actions.yml.
# Copied in by the ci-wirer agent, never auto-enabled -- commit it yourself once
# you're ready for the native suite to run in CI.
#
# Credentials come from masked CI/CD variables (TEST_BASE_URL), never from a committed
# tests/credentials.json. The job's exit code is the suite's verdict.

stages: [test]

native-suite:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:8.0
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"
  variables:
    BASE_URL: $TEST_BASE_URL
  script:
    - dotnet build
    - pwsh bin/Debug/net8.0/playwright.ps1 install --with-deps
    - dotnet test --logger "junit;LogFilePath=../../../tests/results/junit.xml"
  after_script:
    - dotnet tests/JunitToCsv.cs tests/results/junit.xml tests/results/run-$CI_PIPELINE_ID.csv
  artifacts:
    when: always
    paths:
      - tests/results/*.csv
      - tests/results/junit.xml
