# Opt-in CI for Tier 1/2 Java projects, the GitLab CI twin of github-actions.yml.
# Copied in by the ci-wirer agent, never auto-enabled -- commit it yourself once
# you're ready for the native suite to run in CI.
#
# Credentials come from masked CI/CD variables (TEST_BASE_URL), never from a committed
# tests/credentials.json. The job's exit code is the suite's verdict.

stages: [test]

native-suite:
  stage: test
  image: maven:3.9-eclipse-temurin-17
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"
  variables:
    BASE_URL: $TEST_BASE_URL
  script:
    - mvn -q -DskipTests install com.microsoft.playwright:playwright:install
    - mvn -q test
  after_script:
    - java tests/JunitToCsv.java target/surefire-reports/TEST-*.xml tests/results/run-$CI_PIPELINE_ID.csv
  artifacts:
    when: always
    paths:
      - tests/results/*.csv
      - target/surefire-reports/**
