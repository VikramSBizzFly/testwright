# Opt-in CI for Tier 1/2 Python projects, the Bitbucket Pipelines twin of github-actions.yml.
# Copied in by the ci-wirer agent, never auto-enabled -- commit it yourself once
# you're ready for the native suite to run in CI.
#
# Credentials come from a secured repository variable (TEST_BASE_URL), never from a committed
# tests/credentials.json. The job's exit code is the suite's verdict.

image: python:3.11

pipelines:
  pull-requests:
    '**':
      - step: &native
          name: testwright (native)
          script:
            - pip install -r requirements.txt
            - playwright install --with-deps
            - BASE_URL=$TEST_BASE_URL pytest tests/specs --junitxml=tests/results/junit.xml
          after-script:
            - python tests/junit_to_csv.py tests/results/junit.xml tests/results/run-$BITBUCKET_BUILD_NUMBER.csv
          artifacts:
            - tests/results/*.csv
            - test-results/**
  custom:
    testwright:
      - step: *native
