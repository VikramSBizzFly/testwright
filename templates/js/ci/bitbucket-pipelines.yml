# Opt-in CI for Tier 1/2 JavaScript projects, the Bitbucket Pipelines twin of github-actions.yml.
# Copied in by the ci-wirer agent, never auto-enabled -- commit it yourself once
# you're ready for the native suite to run in CI.
#
# Credentials come from a secured repository variable (TEST_BASE_URL), never from a committed
# tests/credentials.json. The job's exit code is the suite's verdict.

image: node:20

pipelines:
  pull-requests:
    '**':
      - step: &native
          name: testwright (native)
          script:
            - npm ci
            - npx playwright install --with-deps
            - BASE_URL=$TEST_BASE_URL npx playwright test
          after-script:
            - node tests/junit-to-csv.mjs tests/results/junit.xml tests/results/run-$BITBUCKET_BUILD_NUMBER.csv
          artifacts:
            - tests/results/*.csv
            - test-results/**
  custom:
    testwright:
      - step: *native
